<!DOCTYPE html>
<html>
<head>
<title>Language Game</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<h1>🌎 Language Game</h1>

<select id="language">
<option>Spanish</option>
<option>French</option>
<option>German</option>
<option>Japanese</option>
</select>

<select id="difficulty">
<option>easy</option>
<option>medium</option>
<option>hard</option>
</select>

<button onclick="startGame()">Start</button>

<div id="questions"></div>

<button onclick="submitAnswers()">Submit</button>

<h2>Leaderboard</h2>
<ul id="leaderboard"></ul>

<script>

let questions=[]

async function startGame(){

const language=document.getElementById("language").value
const difficulty=document.getElementById("difficulty").value

const res=await fetch("/start_language",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({language,difficulty})
})

const data=await res.json()

questions=data.questions

let html=""

data.questions.forEach((q,i)=>{

html+=`<div>
<p>${q.question}</p>
${q.options.map((o,j)=>`
<label>
<input type="radio" name="q${i}" value="${j}">
${o}
</label><br>`).join("")}
</div>`
})

document.getElementById("questions").innerHTML=html
}

async function submitAnswers(){

let answers=[]

questions.forEach((q,i)=>{

let selected=document.querySelector(`input[name="q${i}"]:checked`)
answers.push(selected?parseInt(selected.value):-1)

})

const res=await fetch("/submit_language",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({answers})
})

const data=await res.json()

alert(`You got ${data.correct}/5 and earned ${data.xp} XP`)

loadLeaderboard()
}

async function loadLeaderboard(){

const res=await fetch("/language_leaderboard")
const data=await res.json()

let html=""

Object.entries(data).forEach(([user,stats])=>{
html+=`<li>${user} — Level ${stats.level} (${stats.xp} XP)</li>`
})

document.getElementById("leaderboard").innerHTML=html
}

loadLeaderboard()

</script>

</body>
</html>
