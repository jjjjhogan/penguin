<!DOCTYPE html>
<html>
<head>
<title>Language Learning</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<h1>🌎 Language Learning Game</h1>

<div>

<select id="language">
<option>Spanish</option>
<option>French</option>
<option>German</option>
<option>Japanese</option>
</select>

<select id="difficulty">
<option value="no-brainer">No-Brainer 😄</option>
<option value="easy">Easy</option>
<option value="medium">Medium</option>
<option value="hard">Hard</option>
</select>

<button onclick="startGame()">Start Game</button>

</div>

<hr>

<div id="questions"></div>

<br>

<button onclick="submitAnswers()">Submit Answers</button>

<p id="result"></p>

<br>

<a href="/home">
<button>🏠 Home</button>
</a>

<a href="/leaderboard">
<button>🏆 Leaderboard</button>
</a>

<script>

let questions = []

async function startGame(){

const language = document.getElementById("language").value
const difficulty = document.getElementById("difficulty").value

const res = await fetch("/start_conversation",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({language, difficulty})
})

const data = await res.json()

prompts = data.prompts

let html=""

prompts.forEach((p,i)=>{

html += `
<div>
<p><b>${p.english}</b></p>
<textarea id="answer${i}" rows="2" cols="40"></textarea>
</div><hr>
`

})

document.getElementById("prompts").innerHTML = html
}   
async function submitAnswers(){

let answers = []

questions.forEach((q,i)=>{

let selected = document.querySelector(`input[name="q${i}"]:checked`)

answers.push(selected ? parseInt(selected.value) : -1)

})

try{

const res = await fetch("/submit_language",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({answers})
})

if(!res.ok){
throw new Error("Server returned "+res.status)
}

const data = await res.json()

document.getElementById("result").innerText =
`You got ${data.correct}/5 correct and earned ${data.xp} XP!`

}catch(err){

console.error("Submit error:",err)
alert("Error submitting answers")

}

}

</script>

</body>
</html>
