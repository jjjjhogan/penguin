<!DOCTYPE html>
<html>
<head>
<title>Language Learning</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<h1>🌎 Language Learning Game</h1>

<div>

<!-- 🔥 NEW: text input instead of dropdown -->
<input id="language" placeholder="Enter a language (e.g. Spanish, Korean, Italian)">

<select id="difficulty">
<option value="no-brainer">No-Brainer 😄</option>
<option value="easy">Easy</option>
<option value="medium">Medium</option>
<option value="hard">Hard</option>
</select>

<button onclick="startGame()">Start Game</button>

</div>

<hr>

<div id="questions"></div>

<br>

<button onclick="submitAnswers()">Submit Answers</button>

<p id="result"></p>

<br>

<a href="/home"><button>🏠 Home</button></a>
<a href="/leaderboard"><button>🏆 Leaderboard</button></a>

<script>

let questions = []

async function startGame(){

const language = document.getElementById("language").value.trim()
const difficulty = document.getElementById("difficulty").value

// 🔴 Prevent empty input
if(!language){
alert("Please enter a language")
return
}

const res = await fetch("/start_language",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({language, difficulty})
})

if(!res.ok){
alert("Failed to start game")
return
}

const data = await res.json()

questions = data.questions

let html=""

data.questions.forEach((q,i)=>{

html += `<div>

<p><b>${i+1}. ${q.question}</b></p>

${q.options.map((o,j)=>`
<label>
<input type="radio" name="q${i}" value="${j}">
${o}
</label><br>
`).join("")}

</div><hr>`

})

document.getElementById("questions").innerHTML = html

}

async function submitAnswers(){

let answers = []

questions.forEach((q,i)=>{

let selected = document.querySelector(`input[name="q${i}"]:checked`)

answers.push(selected ? parseInt(selected.value) : -1)

})

try{

const res = await fetch("/submit_language",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({answers})
})

if(!res.ok){
throw new Error("Server returned "+res.status)
}

const data = await res.json()

document.getElementById("result").innerText =
`You got ${data.correct}/5 correct and earned ${data.xp} XP!`

}catch(err){

console.error("Submit error:",err)
alert("Error submitting answers")

}

}

</script>

</body>
</html>
