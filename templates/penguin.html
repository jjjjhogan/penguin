<!DOCTYPE html>
<html>
<head>
<title>My Penguin</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<h1>🐧 My Penguin</h1>

<div style="text-align:center;">

<!-- Penguin -->
<div id="penguin" style="
width:100px;
height:100px;
margin:auto;
border-radius:50%;
background: {{ user.penguin.color }};
transition: 0.3s;
"></div>

<p>Level: {{ user.level }}</p>

</div>

<br>

<!-- 🎨 COLOR PICKER -->
<div style="text-align:center;">
<p>Choose your penguin color:</p>

<input type="color" id="colorPicker" value="{{ user.penguin.color }}">
<br><br>

<button onclick="changeColor()">Apply Color</button>
</div>

<br>

<button onclick="pet()">🐧 Pet Penguin</button>
<button onclick="talk()">💬 Talk</button>

<p id="response"></p>

<br>

<a href="/home"><button>🏠 Home</button></a>

<script>

function pet(){
document.getElementById("response").innerText = "Your penguin is happy! 🐧"
}

async function talk(){

const res = await fetch("/penguin_talk",{method:"POST"})
const data = await res.json()

document.getElementById("response").innerText = data.message
}

async function changeColor(){

const color = document.getElementById("colorPicker").value

// update visually instantly
document.getElementById("penguin").style.background = color

// save to server
await fetch("/set_penguin_color",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({color})
})

}

</script>

</body>
</html>
