<!DOCTYPE html>
<html>
<head>
<title>My Penguin</title>

<link rel="stylesheet" href="/static/style.css">

</head>

<body>

<h1>🐧 My Penguin</h1>

<div style="text-align:center;">

<div id="penguin" class="penguin">

<div class="body"></div>
<div class="belly"></div>

<div class="eye left"></div>
<div class="eye right"></div>

<div class="beak"></div>

</div>

<p>Level: {{ user.level }}</p>

</div>

<br>

<div style="text-align:center;">

<p>Choose Penguin Color</p>

<input
type="color"
id="colorPicker"
value="{{ user.penguin_color }}"
>

<br><br>

<button onclick="changeColor()">
Apply Color
</button>

</div>

<br>

<div style="text-align:center;">

<button onclick="pet()">
🐧 Pet Penguin
</button>

<button onclick="talk()">
💬 Talk
</button>

</div>

<p id="response"></p>

<br>

<a href="/home">
<button>🏠 Home</button>
</a>

<script>

document.querySelector(
".penguin .body"
).style.background =
"{{ user.penguin_color }}"

function pet(){

document.getElementById(
"response"
).innerText =
"Your penguin is happy! 🐧"

}

async function talk(){

const res = await fetch(
"/penguin_talk",
{
method:"POST"
}
)

const data = await res.json()

document.getElementById(
"response"
).innerText = data.message

}

async function changeColor(){

const color =
document.getElementById(
"colorPicker"
).value

document.querySelector(
".penguin .body"
).style.background = color

await fetch(
"/set_penguin_color",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({color})
}
)

}

</script>

</body>
</html>
