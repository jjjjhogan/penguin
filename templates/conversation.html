<!DOCTYPE html>
<html>
<head>
<title>Conversation Mode</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<h1>🗣️ Conversation Mode</h1>

<div>

<select id="language">
<option>Spanish</option>
<option>French</option>
<option>German</option>
<option>Japanese</option>
</select>

<select id="difficulty">
<option value="easy">Easy</option>
<option value="medium">Medium</option>
<option value="hard">Hard</option>
</select>

<button onclick="startConversation()">Start Conversation</button>

</div>

<hr>

<div id="prompts"></div>

<br>

<button onclick="submitAnswers()">Submit Responses</button>

<div id="results"></div>

<br>

<a href="/home">
<button>🏠 Home</button>
</a>

<a href="/leaderboard">
<button>🏆 Leaderboard</button>
</a>

<script>

let prompts = []

async function startConversation(){

const language = document.getElementById("language").value
const difficulty = document.getElementById("difficulty").value

const res = await fetch("/start_conversation",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({language, difficulty})
})

if(!res.ok){
alert("Failed to start conversation")
return
}

const data = await res.json()

prompts = data.prompts

let html=""

prompts.forEach((p,i)=>{

html += `
<div>

<p><b>${i+1}. ${p.english}</b></p>

<textarea id="answer${i}" rows="3" cols="50" placeholder="Type your answer here..."></textarea>

</div>
<hr>
`

})

document.getElementById("prompts").innerHTML = html

}

async function submitAnswers(){

let answers = []

prompts.forEach((p,i)=>{
answers.push(document.getElementById(`answer${i}`).value)
})

try{

const res = await fetch("/submit_conversation",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({answers})
})

if(!res.ok){
throw new Error("Server error " + res.status)
}

const data = await res.json()

let html=""

data.results.forEach((r,i)=>{

html += `
<div>

<p><b>Question ${i+1}</b></p>
<p><b>Score:</b> ${r.score}/10</p>
<p><b>Feedback:</b> ${r.feedback}</p>
<p><b>Correction:</b> ${r.correction}</p>

</div>
<hr>
`

})

document.getElementById("results").innerHTML = html

}catch(err){

console.error("Submit error:", err)
alert("Error submitting responses")

}

}

</script>

</body>
</html>
