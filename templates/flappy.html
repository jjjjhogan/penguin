<!DOCTYPE html>
<html>
<head>
<title>Flappy Penguins</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<h1>🐧 Flappy Penguins</h1>
<div style="text-align:center; margin-bottom:10px;">
<p style="color:#666; font-size:14px;">
a relaxing mini game to chill with after a study session
</p>
</div>

<canvas id="game" width="400" height="500"></canvas>

<br>

<button onclick="restart()">Restart</button>
<a href="/home"><button>Home</button></a>

<p id="score">Score: 0</p>

<script>

const canvas = document.getElementById("game")
const ctx = canvas.getContext("2d")

let penguin
let pipes
let score
let gameOver

const gravity = 0.12
const jumpPower = -4

const penguinSize = 34
const minGap = penguinSize * 3

const pipeWidth = 36
const pipeSpeed = 2

const pipeSpacing = 180   // horizontal spacing between pipes

const fps = 120
const frameDelay = 1000 / fps

let lastTime = 0
let frameCount = 0

function start(){

penguin = {
x:80,
y:200,
w:penguinSize,
h:penguinSize,
vel:0
}

pipes=[]
score=0
gameOver=false
frameCount=0

spawnPipe()

}

function spawnPipe(){

const margin = 150

let topHeight = Math.random() * (canvas.height - minGap - margin*2) + margin

pipes.push({
x:canvas.width,
w:pipeWidth,
top:topHeight,
bottom:topHeight + minGap,
passed:false
})

}

function update(){

if(gameOver) return

frameCount++

penguin.vel += gravity
penguin.y += penguin.vel

if(penguin.y > canvas.height) gameOver = true
if(penguin.y < 0) penguin.y = 0

pipes.forEach(p=>{

p.x -= pipeSpeed

if(!p.passed && p.x < penguin.x){
p.passed = true
score++
document.getElementById("score").innerText = "Score: " + score
}

if(
penguin.x < p.x + p.w &&
penguin.x + penguin.w > p.x &&
(penguin.y < p.top || penguin.y + penguin.h > p.bottom)
){
gameOver = true
}

})

pipes = pipes.filter(p=>p.x + p.w > 0)

// spawn new pipe when last pipe moves far enough
let lastPipe = pipes[pipes.length-1]

if(lastPipe && lastPipe.x < canvas.width - pipeSpacing){
spawnPipe()
}

}

function drawPenguin(){

ctx.fillStyle = "black"
ctx.beginPath()
ctx.arc(penguin.x+17, penguin.y+17, 17, 0, Math.PI*2)
ctx.fill()

ctx.fillStyle = "white"
ctx.beginPath()
ctx.arc(penguin.x+17, penguin.y+20, 10, 0, Math.PI*2)
ctx.fill()

ctx.fillStyle = "white"
ctx.beginPath()
ctx.arc(penguin.x+22, penguin.y+12, 4, 0, Math.PI*2)
ctx.fill()

ctx.fillStyle = "black"
ctx.beginPath()
ctx.arc(penguin.x+23, penguin.y+12, 2, 0, Math.PI*2)
ctx.fill()

ctx.fillStyle = "orange"
ctx.beginPath()
ctx.moveTo(penguin.x+30,penguin.y+18)
ctx.lineTo(penguin.x+38,penguin.y+21)
ctx.lineTo(penguin.x+30,penguin.y+24)
ctx.fill()

}

function drawIciclePipe(x,y,width,height){

ctx.fillStyle = "#c8f1ff"
ctx.fillRect(x,y,width,height)

// smaller icicles
for(let i=0;i<width;i+=10){

ctx.beginPath()

ctx.moveTo(x+i,y+height)
ctx.lineTo(x+i+5,y+height+8)
ctx.lineTo(x+i+10,y+height)

ctx.fill()

}

}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height)

drawPenguin()

pipes.forEach(p=>{

drawIciclePipe(p.x,0,p.w,p.top)
drawIciclePipe(p.x,p.bottom,p.w,canvas.height-p.bottom)

})

if(gameOver){

ctx.fillStyle="red"
ctx.font="32px Arial"
ctx.fillText("Game Over",120,250)

}

}

function gameLoop(timestamp){

if(timestamp - lastTime < frameDelay){
requestAnimationFrame(gameLoop)
return
}

lastTime = timestamp

update()
draw()

requestAnimationFrame(gameLoop)

}

document.addEventListener("keydown",e=>{
if(e.code==="Space"){
penguin.vel = jumpPower
}
})

canvas.addEventListener("mousedown",()=>{
penguin.vel = jumpPower
})

function restart(){
start()
}

start()
requestAnimationFrame(gameLoop)

</script>

</body>
</html>
