<!DOCTYPE html>
<html>
<head>
<title>Flappy Penguins</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<h1>🐧 Flappy Penguins</h1>

<canvas id="game" width="400" height="500"></canvas>

<br>

<button onclick="restart()">Restart</button>
<a href="/home"><button>Home</button></a>

<p id="score">Score: 0</p>

<script>

const canvas = document.getElementById("game")
const ctx = canvas.getContext("2d")

let penguin
let pipes
let score
let gameOver

const gravity = 0.15
const jump = -4
const gap = 200

function start(){

penguin = {x:80,y:200,w:30,h:30,vel:0}

pipes=[]

score=0

gameOver=false

}

function spawnPipe(){

let top = Math.random()*200+50

pipes.push({
x:canvas.width,
w:60,
top:top,
bottom:top+gap,
passed:false
})

}

function update(){

if(gameOver) return

penguin.vel+=gravity
penguin.y+=penguin.vel

if(penguin.y>canvas.height) gameOver=true

pipes.forEach(p=>{

p.x-=2

if(!p.passed && p.x< penguin.x){
p.passed=true
score++
document.getElementById("score").innerText="Score: "+score
}

if(
penguin.x < p.x+p.w &&
penguin.x+penguin.w > p.x &&
(penguin.y < p.top || penguin.y+penguin.h > p.bottom)
){
gameOver=true
}

})

pipes=pipes.filter(p=>p.x+p.w>0)

if(Math.random()<0.02) spawnPipe()

}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height)

ctx.fillStyle="black"
ctx.fillRect(penguin.x,penguin.y,penguin.w,penguin.h)

ctx.fillStyle="#9be7ff"

pipes.forEach(p=>{

ctx.fillRect(p.x,0,p.w,p.top)
ctx.fillRect(p.x,p.bottom,p.w,canvas.height-p.bottom)

})

if(gameOver){

ctx.fillStyle="red"
ctx.font="30px Arial"
ctx.fillText("Game Over",120,250)

}

}

function loop(){

update()
draw()

requestAnimationFrame(loop)

}

document.addEventListener("keydown",e=>{
if(e.code==="Space"){
penguin.vel=jump
}
})

canvas.addEventListener("mousedown",()=>{
penguin.vel=jump
})

function restart(){

start()

}

start()
loop()

</script>

</body>
</html>
