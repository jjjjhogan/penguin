<!DOCTYPE html>
<html>
<head>
  <title>Flappy Penguins</title>
  <style>
    body { font-family: Arial; padding:20px; text-align:center; }
    canvas { border:2px solid black; background:#dff4ff; }
    button { padding:8px 12px; margin-top:10px; cursor:pointer; }
  </style>
</head>
<body>

<h1>🐧 Flappy Penguins</h1>
<p><b>SPACE</b> or Click to jump • <b>R</b> to restart</p>

<canvas id="game" width="400" height="500"></canvas>
<br>
<button onclick="restartGame()">Restart Game</button>
<p id="scoreText"><b>Score:</b> 0</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

/* ========= PHYSICS ========= */
const GRAVITY = 0.13;                     // slower fall
const JUMP_FORCE = canvas.height * 0.03; // 3% jump height
const PIPE_GAP = 210;                    // bigger gap

let penguin, pipes, score, frame;
let gameOver = false;
let countdown = 3;
let countdownActive = true;

/* ========= INIT ========= */
function initGame(){
  penguin = {x:80, y:200, w:34, h:38, vel:0};
  pipes = [];
  score = 0;
  frame = 0;
  gameOver = false;

  document.getElementById("scoreText").innerHTML="<b>Score:</b> 0";
  startCountdown();
}

function startCountdown(){
  countdown = 3;
  countdownActive = true;

  const timer=setInterval(()=>{
    countdown--;
    if(countdown<=0){
      clearInterval(timer);
      countdownActive=false;
      spawnPipe();
    }
  },1000);
}

/* ========= PIPES ========= */
function spawnPipe(){
  const top = Math.random()*180 + 40;

  pipes.push({
    x: canvas.width,
    w: 60,
    topH: top,
    bottomY: top + PIPE_GAP,
    passed:false
  });
}

/* ========= DRAW ========= */
function drawPenguin(){
  const x=penguin.x;
  const y=penguin.y;

  ctx.fillStyle="black";
  ctx.beginPath();
  ctx.ellipse(x+17,y+19,17,19,0,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="white";
  ctx.beginPath();
  ctx.ellipse(x+17,y+22,10,14,0,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="orange";
  ctx.beginPath();
  ctx.moveTo(x+30,y+18);
  ctx.lineTo(x+40,y+15);
  ctx.lineTo(x+30,y+22);
  ctx.fill();

  ctx.fillStyle="white";
  ctx.beginPath();
  ctx.arc(x+23,y+12,4,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="black";
  ctx.beginPath();
  ctx.arc(x+24,y+12,2,0,Math.PI*2);
  ctx.fill();
}

function drawPipes(pipe){
  ctx.fillStyle="#9be7ff";
  ctx.fillRect(pipe.x,0,pipe.w,pipe.topH);
  ctx.fillRect(pipe.x,pipe.bottomY,pipe.w,canvas.height-pipe.bottomY);
}

function drawCountdown(){
  ctx.fillStyle="black";
  ctx.font="48px Arial";
  ctx.textAlign="center";
  ctx.fillText(countdown>0?countdown:"GO!",canvas.width/2,canvas.height/2);
  ctx.textAlign="left";
}

/* ========= COLLISION ========= */
function hit(pipe){
  return (
    penguin.x < pipe.x + pipe.w &&
    penguin.x + penguin.w > pipe.x &&
    (penguin.y < pipe.topH ||
     penguin.y + penguin.h > pipe.bottomY)
  );
}

/* ========= UPDATE ========= */
function update(){
  if(gameOver) return;

  frame++;

  penguin.vel += GRAVITY;
  penguin.y += penguin.vel;

  if(penguin.y < 0) penguin.y = 0;
  if(penguin.y + penguin.h > canvas.height)
      gameOver = true;

  if(countdownActive) return;

  for(let p of pipes){
    p.x -= 2;

    if(!p.passed && p.x+p.w < penguin.x){
      p.passed=true;
      score++;
      document.getElementById("scoreText").innerHTML="<b>Score:</b>"+score;
    }

    if(hit(p)) gameOver=true;
  }

  pipes=pipes.filter(p=>p.x+p.w>0);

  if(frame%120===0) spawnPipe();
}

/* ========= RENDER LOOP ========= */
function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(let p of pipes) drawPipes(p);
  drawPenguin();

  if(countdownActive) drawCountdown();

  if(gameOver){
    ctx.fillStyle="red";
    ctx.font="28px Arial";
    ctx.fillText("Game Over",120,240);
  }
}

function gameLoop(){
  update();
  render();
  requestAnimationFrame(gameLoop);
}

/* ========= CONTROLS ========= */
function flap(){
  if(gameOver) return;

  // ⭐ jump uses screen percentage
  penguin.vel = -JUMP_FORCE;
}

function restartGame(){ initGame(); }

document.addEventListener("keydown", function(e){

  // prevent holding key from causing issues
  if(e.repeat) return;

  if(e.code==="Space"){
    e.preventDefault();
    flap();
  }

  if(e.code==="KeyR"){
    restartGame();
  }
});

canvas.addEventListener("mousedown", e=>{
  e.preventDefault();
  flap();
});

/* ========= START ========= */
initGame();
gameLoop();
</script>

</body>
</html>
