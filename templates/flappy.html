<!DOCTYPE html>
<html>
<head>
  <title>Flappy Penguins</title>
  <style>
    body { font-family: Arial; padding: 20px; text-align: center; }
    canvas { border: 2px solid black; background: #dff4ff; }
    button { padding: 8px 12px; margin-top: 10px; cursor: pointer; }
  </style>
</head>
<body>

<h1>🐧 Flappy Penguins</h1>
<p>Logged in as: <b>{{ username }}</b> | <a href="/">Back to Language App</a></p>

<p><b>How to play:</b> Press SPACE or click to flap. Press <b>R</b> to restart.</p>

<canvas id="game" width="400" height="500"></canvas>
<br>
<button onclick="restartGame()">Restart Game</button>

<p id="scoreText"><b>Score:</b> 0</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let penguin, pipes, score, gameOver, frame;

// countdown state
let countdown = 3;
let countdownActive = true;
let countdownTimer = null;

function initGame() {
  penguin = {
    x: 80,
    y: 200,
    w: 30,
    h: 30,
    vel: 0
  };

  pipes = [];
  score = 0;
  gameOver = false;
  frame = 0;

  document.getElementById("scoreText").innerHTML = "<b>Score:</b> 0";

  startCountdown();
}

function startCountdown() {
  countdown = 3;
  countdownActive = true;

  if (countdownTimer) clearInterval(countdownTimer);

  countdownTimer = setInterval(() => {
    countdown--;
    if (countdown <= 0) {
      countdownActive = false;
      clearInterval(countdownTimer);
      countdownTimer = null;
      spawnPipe(); // start pipes after countdown ends
    }
  }, 1000);
}

function spawnPipe() {
  const gap = 150;
  const topHeight = Math.floor(Math.random() * 200) + 40;
  const bottomY = topHeight + gap;

  pipes.push({
    x: canvas.width,
    w: 60,
    topH: topHeight,
    bottomY: bottomY,
    passed: false
  });
}

function drawPenguin() {
  ctx.fillStyle = "black";
  ctx.fillRect(penguin.x, penguin.y, penguin.w, penguin.h);

  ctx.fillStyle = "white";
  ctx.fillRect(penguin.x + 8, penguin.y + 6, penguin.w - 16, penguin.h - 12);

  ctx.fillStyle = "white";
  ctx.fillRect(penguin.x + 20, penguin.y + 8, 6, 6);

  ctx.fillStyle = "black";
  ctx.fillRect(penguin.x + 23, penguin.y + 10, 2, 2);
}

function drawIcicles(pipe) {
  ctx.fillStyle = "#9be7ff";

  ctx.fillRect(pipe.x, 0, pipe.w, pipe.topH);
  ctx.fillRect(pipe.x, pipe.bottomY, pipe.w, canvas.height - pipe.bottomY);

  ctx.fillStyle = "#6fd6ff";
  for (let i = 0; i < pipe.w; i += 12) {
    ctx.beginPath();
    ctx.moveTo(pipe.x + i, pipe.topH);
    ctx.lineTo(pipe.x + i + 6, pipe.topH + 14);
    ctx.lineTo(pipe.x + i + 12, pipe.topH);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(pipe.x + i, pipe.bottomY);
    ctx.lineTo(pipe.x + i + 6, pipe.bottomY - 14);
    ctx.lineTo(pipe.x + i + 12, pipe.bottomY);
    ctx.closePath();
    ctx.fill();
  }
}

function hitTest(pipe) {
  if (
    penguin.x < pipe.x + pipe.w &&
    penguin.x + penguin.w > pipe.x &&
    penguin.y < pipe.topH
  ) return true;

  if (
    penguin.x < pipe.x + pipe.w &&
    penguin.x + penguin.w > pipe.x &&
    penguin.y + penguin.h > pipe.bottomY
  ) return true;

  return false;
}

function update() {
  if (gameOver) return;

  // during countdown: penguin can flap but pipes won't move/spawn
  frame++;

  // ✅ slower falling (gravity reduced)
  penguin.vel += 0.35;   // was 0.6
  penguin.y += penguin.vel;

  if (penguin.y < 0) penguin.y = 0;
  if (penguin.y + penguin.h > canvas.height) gameOver = true;

  if (countdownActive) return;

  for (let p of pipes) {
    p.x -= 2.3;

    if (!p.passed && p.x + p.w < penguin.x) {
      p.passed = true;
      score++;
      document.getElementById("scoreText").innerHTML = "<b>Score:</b> " + score;
    }

    if (hitTest(p)) gameOver = true;
  }

  pipes = pipes.filter(p => p.x + p.w > 0);

  if (frame % 120 === 0) spawnPipe();
}

function drawCountdown() {
  ctx.fillStyle = "rgba(0,0,0,0.6)";
  ctx.font = "48px Arial";
  ctx.textAlign = "center";

  if (countdown > 0) {
    ctx.fillText(countdown, canvas.width / 2, canvas.height / 2);
  } else {
    ctx.fillText("GO!", canvas.width / 2, canvas.height / 2);
  }

  ctx.textAlign = "left";
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let p of pipes) drawIcicles(p);

  drawPenguin();

  if (countdownActive) {
    drawCountdown();
  }

  if (gameOver) {
    ctx.fillStyle = "red";
    ctx.font = "28px Arial";
    ctx.fillText("Game Over!", 120, 220);
    ctx.font = "16px Arial";
    ctx.fillText("Press R or Restart Button", 105, 250);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function flap() {
  if (gameOver) return;

  // ✅ slower / smoother jump
  penguin.vel = -7;   // was -8
}

function restartGame() {
  initGame();
}

document.addEventListener("keydown", (e) => {
  if (e.code === "Space") {
    e.preventDefault();
    flap();
  }

  // ✅ restart from keyboard
  if (e.code === "KeyR") {
    restartGame();
  }
});

canvas.addEventListener("click", () => flap());

initGame();
loop();
</script>

</body>
</html>
