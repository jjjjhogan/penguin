<!DOCTYPE html>
<html>
<head>
<title>Flappy Penguins</title>
<style>
body{font-family:Arial;text-align:center;padding:20px}
canvas{border:2px solid black;background:#dff4ff}
button{padding:8px 12px;margin:5px;cursor:pointer}
</style>
</head>

<body>

<h1>🐧 Flappy Penguins</h1>

<button onclick="goHome()">⬅ Back To Home</button>
<br><br>

<canvas id="game" width="400" height="500"></canvas>
<br>
<button onclick="restartGame()">Restart</button>

<p id="scoreText"><b>Score:</b>0</p>

<h2>Leaderboard</h2>
<ol id="leaderboard"></ol>

<script>

const canvas=document.getElementById("game")
const ctx=canvas.getContext("2d")

const GRAVITY=0.13
const JUMP_FORCE=canvas.height*0.01
const PIPE_GAP=210

let penguin,pipes,score,frame,gameOver=false

let fps=60
let interval=1000/fps
let lastTime=0

function gameLoop(time){
if(time-lastTime>interval){
lastTime=time
update()
render()
}
requestAnimationFrame(gameLoop)
}

function goHome(){
window.location.href="/"
}

function initGame(){
penguin={x:80,y:200,w:34,h:38,vel:0}
pipes=[]
score=0
frame=0
gameOver=false
document.getElementById("scoreText").innerHTML="<b>Score:</b>0"
spawnPipe()
}

function spawnPipe(){
const top=Math.random()*180+40
pipes.push({x:canvas.width,w:60,topH:top,bottomY:top+PIPE_GAP,passed:false})
}

function hit(p){
return(
penguin.x<p.x+p.w &&
penguin.x+penguin.w>p.x &&
(penguin.y<p.topH||penguin.y+penguin.h>p.bottomY)
)
}

function update(){
if(gameOver)return

frame++

penguin.vel+=GRAVITY
penguin.y+=penguin.vel

if(penguin.y<0)penguin.y=0
if(penguin.y+penguin.h>canvas.height){
gameOver=true
saveScore()
}

for(let p of pipes){
p.x-=2

if(!p.passed && p.x+p.w<penguin.x){
p.passed=true
score++
document.getElementById("scoreText").innerHTML="<b>Score:</b>"+score
}

if(hit(p)){
gameOver=true
saveScore()
}
}

pipes=pipes.filter(p=>p.x+p.w>0)

if(frame%120===0)spawnPipe()
}

function drawPenguin(){
let x=penguin.x
let y=penguin.y

ctx.fillStyle="black"
ctx.beginPath()
ctx.ellipse(x+17,y+19,17,19,0,0,Math.PI*2)
ctx.fill()

ctx.fillStyle="white"
ctx.beginPath()
ctx.ellipse(x+17,y+22,10,14,0,0,Math.PI*2)
ctx.fill()

ctx.fillStyle="orange"
ctx.beginPath()
ctx.moveTo(x+30,y+18)
ctx.lineTo(x+40,y+15)
ctx.lineTo(x+30,y+22)
ctx.fill()
}

function drawPipes(p){
ctx.fillStyle="#9be7ff"
ctx.fillRect(p.x,0,p.w,p.topH)
ctx.fillRect(p.x,p.bottomY,p.w,canvas.height-p.bottomY)
}

function render(){
ctx.clearRect(0,0,canvas.width,canvas.height)
for(let p of pipes)drawPipes(p)
drawPenguin()

if(gameOver){
ctx.fillStyle="red"
ctx.font="28px Arial"
ctx.fillText("Game Over",120,240)
}
}

function flap(){
if(gameOver)return
penguin.vel=-JUMP_FORCE
}

function restartGame(){initGame()}

/* GLOBAL LEADERBOARD */

function saveScore(){
fetch("/submit_flappy_score",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({score:score})
})
.then(()=>showLeaderboard())
}

function showLeaderboard(){
fetch("/get_flappy_leaderboard")
.then(r=>r.json())
.then(data=>{
let html=""
data.forEach(s=>{
html+=`<li>${s.user} : ${s.score}</li>`
})
document.getElementById("leaderboard").innerHTML=html
})
}

document.addEventListener("keydown",e=>{
if(e.repeat)return
if(e.code==="Space"){e.preventDefault();flap()}
if(e.code==="KeyR"){restartGame()}
})

canvas.addEventListener("mousedown",e=>{
e.preventDefault()
flap()
})

initGame()
showLeaderboard()
requestAnimationFrame(gameLoop)

</script>
</body>
</html>
