<!DOCTYPE html>
<html>
<head>
<title>Flappy Penguins</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<h1>🐧 Flappy Penguins</h1>

<canvas id="game" width="400" height="500"></canvas>

<br>

<button onclick="restart()">Restart</button>
<a href="/home"><button>Home</button></a>

<p id="score">Score: 0</p>

<script>

const canvas = document.getElementById("game")
const ctx = canvas.getContext("2d")

let penguin
let pipes
let score
let gameOver

const gravity = 0.12
const jumpPower = -4
const gap = 230

function start(){

penguin = {
x:80,
y:200,
w:34,
h:34,
vel:0
}

pipes=[]
score=0
gameOver=false

}

function spawnPipe(){

let top = Math.random()*180 + 50

pipes.push({
x:canvas.width,
w:60,
top:top,
bottom:top+gap,
passed:false
})

}

function update(){

if(gameOver) return

penguin.vel += gravity
penguin.y += penguin.vel

if(penguin.y > canvas.height) gameOver = true

pipes.forEach(p=>{

p.x -= 2

if(!p.passed && p.x < penguin.x){
p.passed = true
score++
document.getElementById("score").innerText = "Score: " + score
}

if(
penguin.x < p.x + p.w &&
penguin.x + penguin.w > p.x &&
(penguin.y < p.top || penguin.y + penguin.h > p.bottom)
){
gameOver = true
}

})

pipes = pipes.filter(p=>p.x + p.w > 0)

if(Math.random() < 0.02) spawnPipe()

}

function drawPenguin(){

// body
ctx.fillStyle = "black"
ctx.beginPath()
ctx.arc(penguin.x+17, penguin.y+17, 17, 0, Math.PI*2)
ctx.fill()

// belly
ctx.fillStyle = "white"
ctx.beginPath()
ctx.arc(penguin.x+17, penguin.y+20, 10, 0, Math.PI*2)
ctx.fill()

// eye
ctx.fillStyle = "white"
ctx.beginPath()
ctx.arc(penguin.x+22, penguin.y+12, 4, 0, Math.PI*2)
ctx.fill()

ctx.fillStyle = "black"
ctx.beginPath()
ctx.arc(penguin.x+23, penguin.y+12, 2, 0, Math.PI*2)
ctx.fill()

// beak
ctx.fillStyle = "orange"
ctx.beginPath()
ctx.moveTo(penguin.x+30,penguin.y+18)
ctx.lineTo(penguin.x+38,penguin.y+21)
ctx.lineTo(penguin.x+30,penguin.y+24)
ctx.fill()

}

function drawIciclePipe(x,y,width,height){

ctx.fillStyle = "#bfefff"
ctx.fillRect(x,y,width,height)

// icicle spikes
for(let i=0;i<width;i+=12){

ctx.beginPath()

ctx.moveTo(x+i,y+height)
ctx.lineTo(x+i+6,y+height+12)
ctx.lineTo(x+i+12,y+height)

ctx.fill()

}

}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height)

drawPenguin()

pipes.forEach(p=>{

// top icicle
drawIciclePipe(p.x,0,p.w,p.top)

// bottom icicle
drawIciclePipe(p.x,p.bottom,p.w,canvas.height-p.bottom)

})

if(gameOver){

ctx.fillStyle="red"
ctx.font="32px Arial"
ctx.fillText("Game Over",120,250)

}

}

function loop(){

update()
draw()
requestAnimationFrame(loop)

}

document.addEventListener("keydown",e=>{
if(e.code==="Space"){
penguin.vel = jumpPower
}
})

canvas.addEventListener("mousedown",()=>{
penguin.vel = jumpPower
})

function restart(){
start()
}

start()
loop()

</script>

</body>
</html>
