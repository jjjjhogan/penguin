<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Penguin Language App</title>
</head>
<body>

<h2>Penguin Language App</h2>

<label>Language:</label>
<input id="language" />
<br><br>

<label>Difficulty:</label>
<select id="difficulty">
    <option value="Easy">Easy</option>
    <option value="Medium">Medium</option>
    <option value="Hard">Hard</option>
    <option value="Impossible">Impossible</option>
    <option value="No Brainer">No Brainer</option>
</select>
<br><br>

<button onclick="start()">Start</button>

<div id="quiz"></div>

<script>
let storedQuestions = {};
let answers = [];

function start() {
    fetch("/start", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            language: document.getElementById("language").value,
            difficulty: document.getElementById("difficulty").value
        })
    })
    .then(res => res.json())
    .then(data => {
        if (data.error) {
            alert(data.error);
            return;
        }
        storedQuestions = data.questions;
        showQuestions();
    })
    .catch(err => alert("Request failed: " + err));
}

function showQuestions() {
    let html = "";
    for (let i = 1; i <= 5; i++) {
        if (!storedQuestions["q" + i]) continue;

        html += `<p>${storedQuestions["q" + i]}</p>`;
        storedQuestions["q" + i + "a"].forEach((a, idx) => {
            html += `
                <label>
                    <input type="radio" name="q${i}" value="${idx + 1}">
                    ${idx + 1}: ${a}
                </label><br>
            `;
        });
    }
    html += `<br><button onclick="submitAnswers()">Submit</button>`;
    document.getElementById("quiz").innerHTML = html;
}

function submitAnswers() {
    answers = [];
    for (let i = 1; i <= 5; i++) {
        let selected = document.querySelector(`input[name="q${i}"]:checked`);
        answers.push(selected ? selected.value : null);
    }

    fetch("/submit", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            questions: storedQuestions,
            answers: answers
        })
    })
    .then(res => res.json())
    .then(data => {
        if (data.error) {
            alert(data.error);
            return;
        }
        alert(data.result);
    })
    .catch(err => alert("Submission failed: " + err));
}
</script>

</body>
</html>
