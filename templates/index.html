<!DOCTYPE html>
<html>
<head>
    <title>Language Learning</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1>🌍 Language Learning Game</h1>

    <!-- Language Selection -->
    <label>Choose Language:</label>
    <select id="language">
        <option value="Spanish">Spanish</option>
        <option value="French">French</option>
        <option value="German">German</option>
        <option value="Japanese">Japanese</option>
    </select>

    <br><br>

    <!-- Difficulty Selection -->
    <label>Choose Difficulty:</label>
    <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
    </select>

    <br><br>

    <button class="main-btn" onclick="startGame()">Start Game</button>

    <div id="questions" style="margin-top:30px;"></div>

    <div id="results" style="margin-top:30px;"></div>

    <br>
    <a href="{{ url_for('home') }}">
        <button class="main-btn">⬅ Back Home</button>
    </a>

</div>

<script>

let currentQuestions = [];

function startGame() {

    const selectedLanguage = document.getElementById("language").value;
    const selectedDifficulty = document.getElementById("difficulty").value;

    fetch("/start_language", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            language: selectedLanguage,
            difficulty: selectedDifficulty
        })
    })
    .then(res => {
        if (!res.ok) {
            throw new Error("Server returned " + res.status);
        }
        return res.json();
    })
    .then(data => {

        if (!data.questions) {
            throw new Error("Invalid question format from server");
        }

        currentQuestions = data.questions;

        displayQuestions();

    })
    .catch(err => {
        console.error("Error:", err);
        alert("Something went wrong starting the game.");
    });
}

function displayQuestions() {

    const container = document.getElementById("questions");
    container.innerHTML = "";

    currentQuestions.forEach((q, index) => {

        let questionHTML = `
            <div style="margin-bottom:20px;">
                <h3>Question ${index + 1}</h3>
                <p>${q.question}</p>
        `;

        q.options.forEach((option, i) => {
            questionHTML += `
                <label>
                    <input type="radio" name="q${index}" value="${i}">
                    ${option}
                </label><br>
            `;
        });

        questionHTML += `</div>`;

        container.innerHTML += questionHTML;
    });

    container.innerHTML += `
        <button class="main-btn" onclick="submitAnswers()">Submit Answers</button>
    `;
}

function submitAnswers() {

    let answers = [];

    currentQuestions.forEach((q, index) => {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        answers.push(selected ? parseInt(selected.value) : -1);
    });

    fetch("/submit_language", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ answers: answers })
    })
    .then(res => {
        if (!res.ok) {
            throw new Error("Server returned " + res.status);
        }
        return res.json();
    })
    .then(data => {

        displayResults(data);

    })
    .catch(err => {
        console.error("Submit error:", err);
        alert("Error submitting answers.");
    });
}

function displayResults(data) {

    const resultsDiv = document.getElementById("results");

    let html = `<h2>Results</h2>`;
    html += `<p>You got ${data.correct} correct!</p>`;
    html += `<p>You earned ${data.xp_gained} XP!</p>`;

    data.feedback.forEach((item, index) => {

        if (item.status === "correct") {
            html += `<p class="correct">Question ${index + 1}: Correct ✅</p>`;
        } else {
            html += `
                <p class="incorrect">
                    Question ${index + 1}: Incorrect ❌ <br>
                    Correct Answer: ${item.correct_answer}
                </p>
            `;
        }
    });

    resultsDiv.innerHTML = html;
}

</script>

</body>
</html>
