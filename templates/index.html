<<script>
let storedQuestions = {};
let answers = [];
let correctCount = 0;

const difficultyOrder = ["No Brainer", "Easy", "Medium", "Hard", "Impossible"];

function restartApp() {
    let difficultySelect = document.getElementById("difficulty");
    let currentDifficulty = difficultySelect.value;
    let index = difficultyOrder.indexOf(currentDifficulty);

    if (correctCount <= 1 && index > 0) {
        index -= 1;
    } 
    else if (correctCount >= 4 && index < difficultyOrder.length - 1) {
        index += 1;
    }

    difficultySelect.value = difficultyOrder[index];

    storedQuestions = {};
    answers = [];
    correctCount = 0;

    document.getElementById("quiz").innerHTML = "";
    document.getElementById("result").innerText = "";
    document.getElementById("loading").style.display = "none";
}
</script>
