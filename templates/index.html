<!DOCTYPE html>
<html>
<head>
    <title>Play</title>
</head>
<body>

<h2>Welcome, {{ username }}!</h2>

<a href="/leaderboard">Leaderboard</a> |
<a href="/logout">Logout</a>

<hr>

<label>Language:</label>
<input id="language" value="Spanish"><br><br>

<label>Difficulty:</label>
<select id="difficulty">
    {% for d in difficulties %}
    <option value="{{ d }}">{{ d }}</option>
    {% endfor %}
</select>

<br><br>

<button onclick="start()">Start</button>

<div id="loading" style="display:none;">Loading questions...</div>
<div id="quiz"></div>
<div id="result"></div>

<script>
let answers = [];

function start() {
    document.getElementById("loading").style.display = "block";
    document.getElementById("quiz").innerHTML = "";
    document.getElementById("result").innerText = "";

    fetch("/start", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            language: language.value,
            difficulty: difficulty.value
        })
    })
    .then(r => r.json())
    .then(qs => {
        document.getElementById("loading").style.display = "none";
        showQuiz(qs);
    });
}

function showQuiz(qs) {
    let html = "";
    for (let i = 1; i <= 5; i++) {
        html += `<p>${qs["q"+i]}</p>`;
        qs["q"+i+"a"].forEach((a, idx) => {
            html += `<button onclick="answers[${i-1}]='${idx+1}'">${idx+1}: ${a}</button><br>`;
        });
    }
    html += `<br><button onclick="submitAnswers()">Submit</button>`;
    quiz.innerHTML = html;
}

function submitAnswers() {
    fetch("/submit", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({answers})
    })
    .then(r => r.json())
    .then(data => {
        result.innerHTML = `
            <p><b>Score:</b> ${data.correct}/5</p>
            <p><b>Recommended Difficulty:</b> ${data.recommended}</p>
            <p><a href="/leaderboard">View Leaderboard</a></p>
        `;
    });
}
</script>

</body>
</html>
