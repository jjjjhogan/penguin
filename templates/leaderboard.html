<!DOCTYPE html>
<html>
<head>
    <title>Penguin Leaderboard</title>
    <link rel="stylesheet" href="/static/style.css">

    <style>
        table {
            margin: auto;
            border-collapse: collapse;
            min-width: 700px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #f0f8ff;
        }

        .penguin-icon {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: inline-block;
            border: 2px solid black;
        }

        #leaderboardContainer {
            display: flex;
            justify-content: center;
        }

        h1 {
            text-align: center;
        }

        .buttons {
            text-align: center;
            margin-top: 20px;
        }

        .buttons button {
            margin: 5px;
        }
    </style>
</head>

<body>

<h1>🏆 Penguin Leaderboard</h1>

<div id="leaderboardContainer">

    <table id="leaderboardTable">

        <thead>
            <tr>
                <th>Penguin</th>
                <th>Username</th>
                <th>Score</th>
                <th>XP</th>
                <th>Level</th>
            </tr>
        </thead>

        <tbody id="leaderboardBody">

            <tr>
                <td colspan="5">Loading...</td>
            </tr>

        </tbody>

    </table>

</div>

<div class="buttons">

    <a href="/home">
        <button>🏠 Home</button>
    </a>

    <a href="/penguin">
        <button>🐧 My Penguin</button>
    </a>

</div>

<script>

async function loadLeaderboard() {

    try {

        const res = await fetch("/leaderboard_data");

        if (!res.ok) {
            throw new Error("Failed to load leaderboard");
        }

        const players = await res.json();

        players.sort((a, b) => {

            if (b.level === a.level) {
                return b.xp - a.xp;
            }

            return b.level - a.level;
        });

        let html = "";

        players.forEach(player => {

            html += `
            <tr>

                <td>
                    <div
                        class="penguin-icon"
                        style="background:${player.penguin_color || '#000000'};">
                    </div>
                </td>

                <td>${player.username}</td>

                <td>${player.score}</td>

                <td>${player.xp}</td>

                <td>${player.level}</td>

            </tr>
            `;
        });

        if (players.length === 0) {

            html = `
            <tr>
                <td colspan="5">
                    No players yet.
                </td>
            </tr>
            `;
        }

        document.getElementById("leaderboardBody").innerHTML = html;

    }
    catch (err) {

        console.error(err);

        document.getElementById("leaderboardBody").innerHTML = `
        <tr>
            <td colspan="5">
                Failed to load leaderboard.
            </td>
        </tr>
        `;
    }
}

loadLeaderboard();

</script>

</body>
</html>
