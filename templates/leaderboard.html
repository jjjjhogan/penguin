<!DOCTYPE html>
<html>
<head>
<title>Leaderboard</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<h1>🏆 Penguin Leaderboard</h1>

<ul id="leaderboard"></ul>

<br>

<a href="/home"><button>🏠 Home</button></a>

<script>

async function loadLeaderboard(){

    const res = await fetch("/language_leaderboard")

    if(!res.ok){
        console.error("Failed to load leaderboard")
        return
    }

    const data = await res.json()

    const players = Object.entries(data)
    console.log(players)
    players.sort((a,b)=>{
        if(b[1].level === a[1].level){
            return b[1].xp - a[1].xp
        }
        return b[1].level - a[1].level
    })

    let html = "<table><th>Avatar</th><th>Name</th><th>score</th><th>xp</th><th>level</th>"

    players.forEach(([user,stats])=>{
        html += `

<tr>
<td>🐧</td>
<td> ${user}</td>
<td>${stats.score}</td>
<td>${stats.xp}/20</td>
<td>${stats.level}</td>
</tr>
`
    })
    html += '</table>'
    console.log(html);
    document.getElementById("leaderboard").innerHTML = html
}

loadLeaderboard()

</script>

</body>
</html>
