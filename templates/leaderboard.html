<!DOCTYPE html>
<html>
<head>
    <title>Leaderboard</title>
</head>
<body>

<h1>🏆 Leaderboard</h1>

<a href="/">Home</a> | <a href="/play">Play</a>

<hr>

<ol>
{% for entry in leaderboard %}
    <li>
        <b>{{ entry.username }}</b> — {{ entry.score }}/5 ({{ entry.difficulty }})
    </li>
{% else %}
    <p>No scores yet.</p>
{% endfor %}
</ol>

</body>
</html>
