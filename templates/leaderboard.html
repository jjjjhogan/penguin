<!DOCTYPE html>
<html>
<head>
    <title>Language Leaderboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">
    <h1>🏆 Language Leaderboard</h1>

    <table>
        <tr>
            <th>Rank</th>
            <th>User</th>
            <th>XP</th>
            <th>Level</th>
        </tr>
        {% for player in leaderboard %}
        <tr>
            <td>{{ loop.index }}</td>
            <td>{{ player.user }}</td>
            <td>{{ player.xp }}</td>
            <td>{{ player.level }}</td>
        </tr>
        {% endfor %}
    </table>

    <h2 style="margin-top:50px;">XP Graph</h2>
    <canvas id="xpChart" width="600" height="400"></canvas>

    <br><br>
    <a href="/">
        <button class="main-btn">⬅ Back Home</button>
    </a>
</div>

<script>
fetch("/language_leaderboard_data")
.then(res => res.json())
.then(data => {
    const labels = data.map(p => p.user);
    const xp = data.map(p => p.xp);

    const ctx = document.getElementById("xpChart").getContext("2d");

    new Chart(ctx, {
        type: "bar",
        data: {
            labels: labels,
            datasets: [{
                label: "XP",
                data: xp
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { display: false }
            }
        }
    });
});
</script>

</body>
</html>
